name: Release Sanity Check

on:
  push:
    tags:
      - "v*"

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build unsigned macOS arm64 artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          mise exec -- pnpm run build
          mise exec -- pnpm exec electron-builder --config electron-builder.yml --mac dmg zip --arm64 --publish never
