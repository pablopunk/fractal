<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractal — Connection failed</title>
<style>
  :root {
    --bg: #0a0a0a;
    --text: #e0e0e0;
    --text-muted: #888;
    --accent: #ff6a3d;
    --radius-sm: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
  }
  .container { text-align: center; padding: 40px 32px; max-width: 380px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
  .btn {
    display: block; width: 100%; padding: 12px 16px;
    border: none; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 500; font-family: var(--font-sans);
    cursor: pointer;
  }
  .btn:hover { background: #e85d2e; }
  .url { font-size: 12px; color: var(--text-muted); margin-top: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="container">
  <h1>Couldn't reach Fractal</h1>
  <p>The host is unavailable or remote access is not enabled.</p>
  <button class="btn" onclick="switchBack()">Switch back to Host Mode</button>
  <div class="url" id="url"></div>
</div>
<script>
  document.getElementById("url").textContent = location.href;
  function switchBack() {
    var api = window.electron;
    if (api && api.setMode) {
      api.setMode("host", "");
    }
  }
</script>
</body>
</html>
