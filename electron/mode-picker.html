<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal — Setup</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --text: #e0e0e0;
    --text-muted: #888;
    --text-faint: #555;
    --accent: #ff6a3d;
    --accent-soft: rgba(255, 106, 61, 0.12);
    --border: rgba(255, 255, 255, 0.08);
    --radius: 10px;
    --radius-sm: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Monaco, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .container {
    text-align: center;
    padding: 40px 32px;
    max-width: 380px;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: background 80ms, border-color 80ms;
  }
  .btn:hover { background: #262626; border-color: rgba(255, 255, 255, 0.14); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { background: #e85d2e; border-color: #e85d2e; }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .btn-hint {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 24px;
  }

  .input {
    width: 100%;
    padding: 11px 14px;
    margin-bottom: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-mono);
    outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--text-faint); }

  .error {
    color: #ef4444;
    font-size: 12px;
    margin: 8px 0;
    min-height: 16px;
  }

  .back {
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-faint);
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-sans);
  }
  .back:hover { color: var(--text-muted); }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">Fractal</div>
  <p class="subtitle">Choose how to use Fractal on this device.</p>

  <div id="screen-pick">
    <button class="btn primary" id="btn-host">Run as Host</button>
    <span class="btn-hint">Everything runs on this machine</span>
    <button class="btn" id="btn-remote-show">Connect to a Host</button>
    <span class="btn-hint">Use a Fractal host on your tailnet</span>
  </div>

  <div id="screen-remote" class="hidden">
    <input class="input" id="remote-url" type="url" autocomplete="off" spellcheck="false"
      placeholder="https://laptop.tail1234.ts.net">
    <button class="btn primary" id="btn-connect" disabled>Connect</button>
    <div class="error" id="url-error"></div>
    <button class="back" id="btn-back">← Back</button>
  </div>

  <div class="error" id="fatal-error" style="margin-top: 20px;"></div>
</div>

<script>
(function () {
  var api = window.electronAPI;

  if (!api || typeof api.selectMode !== "function") {
    var err = document.getElementById("fatal-error");
    if (err) err.textContent = "Unable to connect to Fractal. Please restart the app.";
    if (api) console.error("[fractal-startup] electronAPI exists but selectMode is missing", Object.keys(api));
    else console.error("[fractal-startup] electronAPI is undefined — preload may have failed");
    return;
  }

  var urlInput = document.getElementById("remote-url");
  var connectBtn = document.getElementById("btn-connect");
  var urlError = document.getElementById("url-error");

  function showPick() {
    document.getElementById("screen-pick").classList.remove("hidden");
    document.getElementById("screen-remote").classList.add("hidden");
  }

  function showRemote() {
    document.getElementById("screen-pick").classList.add("hidden");
    document.getElementById("screen-remote").classList.remove("hidden");
    if (urlInput) setTimeout(function () { urlInput.focus(); }, 50);
  }

  function validateUrl() {
    var val = (urlInput.value || "").trim();
    if (!val) {
      connectBtn.disabled = true;
      urlError.textContent = "";
      return;
    }
    var ok = false;
    try { ok = new URL(val).protocol === "https:"; } catch (_) {}
    connectBtn.disabled = !ok;
    urlError.textContent = ok ? "" : "Enter a valid HTTPS URL";
  }

  function pickHost() {
    try { api.selectMode({ mode: "host" }); } catch (e) { console.error("[fractal-startup] pickHost failed", e); }
  }

  function pickRemote() {
    var url = (urlInput.value || "").trim();
    if (!url || !/^https:\/\//.test(url)) return;
    try { api.selectMode({ mode: "remote", remoteUrl: url }); } catch (e) { console.error("[fractal-startup] pickRemote failed", e); }
  }

  document.getElementById("btn-host").addEventListener("click", pickHost);
  document.getElementById("btn-remote-show").addEventListener("click", showRemote);
  document.getElementById("btn-back").addEventListener("click", showPick);
  document.getElementById("btn-connect").addEventListener("click", pickRemote);
  if (urlInput) {
    urlInput.addEventListener("input", validateUrl);
    urlInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !connectBtn.disabled) pickRemote();
    });
  }
})();
</script>

</body>
</html>
